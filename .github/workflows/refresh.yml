name: Auto-Refresh IPTV Playlist

on:
  schedule:
    # Runs at minute 0 every 2 hours
    - cron: '0 */2 * * *'
  # Allows you to manually trigger it anytime from the GitHub website
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Execute playlist generator
        run: |
          python update_playlist.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add iptv.m3u
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto-update stream tokens [skip ci]"
            git push
          fi
